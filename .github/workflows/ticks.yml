name: Baixar ticks XAUUSD

on:
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses AAAA-MM separados por virgula (ex: 2026-01,2026-02,2026-03)'
        required: true
        default: '2026-04,2026-05,2026-06'
      passes:
        description: 'Quantas vezes rebaixar os dias que ficarem com hora sem tick'
        required: false
        default: '3'
      teste_tempo_real:
        description: 'Só testar o getRealTimeRates numa hora (AAAA-MM-DDTHH), sem baixar meses'
        required: false
        default: ''
      opcoes:
        description: 'Opções extras do dukascopy-node (novas tentativas)'
        required: false
        default: '-r 5 -rp 10000 -bs 3 -bp 3000'

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.m.outputs.lista }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> $GITHUB_OUTPUT
          import json,os
          m=[x.strip() for x in os.environ['MESES'].split(',') if x.strip()]
          print('lista='+json.dumps(m))
          EOF
        env:
          MESES: ${{ inputs.meses }}

  teste_tempo_real:
    if: ${{ inputs.teste_tempo_real != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testar getRealTimeRates
        run: |
          npm i --no-save dukascopy-node@1.50.0 >/dev/null 2>&1
          H="${{ inputs.teste_tempo_real }}"
          teste () { OUT=$(node .github/scripts/tempo_real.js "$1" "$2" t.csv 2>&1 || true); echo "$OUT"; echo "::notice title=getRealTimeRates $3::$(echo "$OUT" | tail -c 700 | tr '\n' ' ')"; }
          teste ultimos x "últimos 50 ticks"
          DE=$(python3 -c "import datetime as d; t=d.datetime.strptime('$H','%Y-%m-%dT%H'); print(t.strftime('%Y-%m-%dT%H:%M:%S.000Z'))")
          ATE=$(python3 -c "import datetime as d; t=d.datetime.strptime('$H','%Y-%m-%dT%H')+d.timedelta(hours=1); print(t.strftime('%Y-%m-%dT%H:%M:%S.000Z'))")
          teste "$DE" "$ATE" "hora $H"
          ONTEM=$(python3 -c "import datetime as d; t=(d.datetime.utcnow()-d.timedelta(days=1)).replace(hour=15,minute=0,second=0,microsecond=0); print(t.strftime('%Y-%m-%dT%H:%M:%S.000Z'), (t+d.timedelta(minutes=10)).strftime('%Y-%m-%dT%H:%M:%S.000Z'))")
          teste ${ONTEM} "ontem 15h UTC"
          teste "2026-10-13T14:00:00.000Z" "2026-10-13T14:10:00.000Z" "hoje 14h UTC"

  baixar:
    needs: montar
    if: ${{ inputs.teste_tempo_real == '' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        mes: ${{ fromJson(needs.montar.outputs.lista) }}
    env:
      DUKA_VERSAO: '1.50.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar ${{ matrix.mes }}
        run: |
          set -e
          MES="${{ matrix.mes }}"
          DE="${MES}-01"
          ATE=$(date -u -d "${DE} +1 month" +%F)
          echo "periodo: $DE ate $ATE"
          mkdir -p dados
          # -r/-rp: tenta de novo quando a Dukascopy falha (o padrão é 0 tentativas, e a hora some sem aviso).
          # A Dukascopy responde 'status 202' quando limita o acesso; por isso as pausas longas e no máximo 2 meses ao mesmo tempo.
          # O passo seguinte confere e rebaixa os dias que ainda ficarem com buraco.
          npx -y dukascopy-node@${DUKA_VERSAO} \
            -i xauusd -from "$DE" -to "$ATE" \
            -t tick -f csv -v true -fl false \
            ${{ inputs.opcoes || '-r 5 -rp 10000 -bs 3 -bp 3000' }} \
            -dir dados -fn "xauusd_tick_${MES}" > baixar.log 2>&1 || {
              echo "::error title=dukascopy-node falhou em ${MES}::$(tail -c 900 baixar.log | tr '\n' ' ')"; cat baixar.log | tail -50; exit 1; }
          tail -20 baixar.log
          ls -lh dados/
          test -s dados/xauusd_tick_${MES}.csv || {
            echo "::error title=Arquivo de ${MES} vazio ou ausente::arquivos: $(ls -la dados | tr '\n' ' ') | log: $(tail -c 700 baixar.log | tr '\n' ' ')"; exit 1; }
          echo "=============== CONFERENCIA DO FORMATO ==============="
          echo "cabecalho:"; head -1 dados/xauusd_tick_${MES}.csv
          echo "primeiras linhas:"; head -4 dados/xauusd_tick_${MES}.csv | tail -3
          echo "colunas: $(head -1 dados/xauusd_tick_${MES}.csv | awk -F, '{print NF}')"
          echo "linhas: $(wc -l < dados/xauusd_tick_${MES}.csv)"
          if head -1 dados/xauusd_tick_${MES}.csv | grep -qi "ask" && head -1 dados/xauusd_tick_${MES}.csv | grep -qi "bid"; then
            echo ">>> OK: bid e ask no mesmo arquivo"
          else
            echo ">>> ATENCAO: o arquivo parece ter so um lado do preco"
          fi
          echo "====================================================="

      - name: Conferir horas sem tick e rebaixar os dias com buraco
        run: |
          MES="${{ matrix.mes }}"
          python3 .github/scripts/conferir_ticks.py dados/xauusd_tick_${MES}.csv "$MES" \
            --passes "${{ inputs.passes || '3' }}" --relatorio dados/lacunas_${MES}.txt
          {
            echo "### Ticks XAUUSD ${MES}"
            echo '```'
            head -40 dados/lacunas_${MES}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compactar
        run: |
          gzip -9 dados/xauusd_tick_${{ matrix.mes }}.csv
          ls -lh dados/

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ticks-${{ matrix.mes }}
          name: Ticks XAUUSD ${{ matrix.mes }}
          files: |
            dados/*.gz
            dados/lacunas_*.txt
          overwrite_files: true
